<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Miner Advisor</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2230; --muted: #667085;
  --line: #e3e6ec; --accent: #2f5bd3; --accent-soft: #e8eefc;
  --good: #1f7a4d; --good-soft: #e5f4ec; --warn: #9a5b00; --warn-soft: #fdf1dc;
  --bad: #b42318; --bad-soft: #fdeceb; --user: #2f5bd3; --user-ink: #ffffff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141b; --panel: #181c25; --ink: #e6e9f0; --muted: #98a1b3;
    --line: #2a3040; --accent: #7c9cff; --accent-soft: #1f2a47;
    --good: #5fd39a; --good-soft: #15302a; --warn: #f0b64d; --warn-soft: #33290f;
    --bad: #ff8a80; --bad-soft: #3a1a18; --user: #3d5fcf; --user-ink: #ffffff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--good); background: var(--good-soft); border-color: transparent; }
.pill.off { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
header .spacer { flex: 1; }
.langs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.langs button { background: transparent; color: var(--muted); border-radius: 0; padding: 3px 10px;
  font-size: 12.5px; font-weight: 600; }
.langs button.on { background: var(--accent); color: #fff; }
main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px;
  padding: 16px 20px; height: calc(100% - 55px); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  min-height: 0; display: flex; flex-direction: column; }
#data { padding: 16px; overflow: auto; }
h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center;
  color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
.drop.hover, .drop:hover { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { color: var(--ink); }
.or { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0; }
select, input[type=text], textarea { width: 100%; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
  background: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
button.ghost { background: var(--accent-soft); color: var(--accent); }
.facts { margin-top: 14px; }
.facts .name { font-weight: 650; word-break: break-all; }
.facts .how { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.kv div { background: var(--bg); border-radius: 8px; padding: 8px; }
.kv b { display: block; font-size: 16px; }
.kv span { font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
tr.sel td { background: var(--accent-soft); font-weight: 600; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.iv { font-size: 11px; color: var(--muted); white-space: nowrap; }
.items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.items span { font-size: 12px; background: var(--bg); border-radius: 6px; padding: 2px 7px; }
#chat { overflow: hidden; }
#log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 820px; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink);
  padding: 9px 13px; border-radius: 14px 14px 4px 14px; max-width: 70%; }
.msg.bot { align-self: flex-start; width: 100%; }
.bubble { background: var(--bg); border-radius: 14px 14px 14px 4px; padding: 11px 14px; }
.src { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.opts button { text-align: left; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); font-weight: 500; }
.opts button:hover { border-color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
  background: var(--panel); }
.pick { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pick .label { color: var(--muted); font-size: 13px; }
.pick .algo { font-size: 18px; font-weight: 700; }
.warn { color: var(--warn); background: var(--warn-soft); border-radius: 8px;
  padding: 6px 10px; font-size: 13px; margin-top: 8px; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; }
.tag.no { color: var(--bad); background: var(--bad-soft); }
.tag.yes { color: var(--good); background: var(--good-soft); }
details { margin-top: 10px; font-size: 13px; }
summary { cursor: pointer; color: var(--muted); }
details li { margin: 4px 0; }
.task { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 8px;
  word-break: break-word; }
form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
form textarea { resize: none; height: 44px; }
.thinking { color: var(--muted); font-style: italic; }
.err { color: var(--bad); }
.empty { color: var(--muted); margin: auto; text-align: center; max-width: 420px; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; height: auto; padding: 12px 16px; }
  #chat { min-height: 70vh; }
  .msg.user { max-width: 88%; }
}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">Generator Miner Advisor</h1>
  <span class="spacer"></span>
  <div class="langs" role="group" aria-label="Language / Dil">
    <button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button>
  </div>
  <span id="st-llm" class="pill">…</span>
  <span id="st-eng" class="pill">…</span>
</header>
<main>
  <section id="data">
    <h2 data-i18n="yourData">Your data</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" hidden>
      <strong data-i18n="dropTitle">Drop a file here or click</strong><br>
      <span data-i18n="dropHint">CSV (baskets, order/item pairs, or 0/1 columns) or SPMF text</span>
    </label>
    <div class="or" data-i18n="or">or try a benchmark dataset</div>
    <div style="display:flex; gap:8px">
      <select id="ds"></select>
      <button class="ghost" id="dsgo" data-i18n="load">Load</button>
    </div>
    <div id="facts" class="facts"></div>
  </section>
  <section id="chat">
    <div id="log"><div class="empty" id="empty" data-i18n="empty">
      Load your data on the left, then ask in your own words what you want to find.
      The file stays on this machine.</div></div>
    <form id="form">
      <textarea id="q" disabled data-i18n-ph="ph" placeholder="e.g. which products are bought together, with the fewest conditions?"></textarea>
      <button id="send" disabled data-i18n="send">Ask</button>
    </form>
  </section>
</main>
<script>
// The language switch decides; the browser's language is only the first guess.
// The choice is sent with every message, so the server's questions, options
// and explanation follow it too.
let TR = (navigator.language || "").toLowerCase().startsWith("tr");
try { const saved = localStorage.getItem("lang"); if (saved) TR = saved === "tr"; } catch (e) {}
const T = {
  title: ["Generator Miner Advisor", "Generator Madencisi Danışmanı"],
  yourData: ["Your data", "Verin"],
  dropTitle: ["Drop a file here or click", "Dosyayı buraya bırak ya da tıkla"],
  dropHint: ["CSV (baskets, order/item pairs, or 0/1 columns) or SPMF text",
             "CSV (sepet satırları, sipariş/ürün çiftleri ya da 0/1 sütunlar) veya SPMF metni"],
  or: ["or try a benchmark dataset", "ya da bir benchmark dataset'i dene"],
  load: ["Load", "Yükle"], send: ["Ask", "Sor"],
  empty: ["Load your data on the left, then ask in your own words what you want to find. The file stays on this machine.",
          "Soldan verini yükle, sonra ne bulmak istediğini kendi cümlelerinle sor. Dosya bu makineden çıkmaz."],
  ph: ["e.g. which products are bought together, with the fewest conditions?",
       "ör. hangi ürünler birlikte alınıyor, mümkün olan en az koşulla?"],
  llmUp: ["language model: on", "dil modeli: açık"], llmDown: ["language model: off (rules)", "dil modeli: kapalı (kurallar)"],
  engOk: ["recommender: ready", "öneri motoru: hazır"], engWait: ["recommender: loading…", "öneri motoru: yükleniyor…"],
  readAs: ["read as", "okunuş"], records: ["records", "kayıt"], items: ["distinct items", "farklı öğe"],
  avglen: ["avg. length", "ort. uzunluk"], thr: ["threshold", "eşik"], fItems: ["frequent items", "sık öğe"],
  fPairs: ["frequent pairs", "sık çift"], suggested: ["suggested", "önerilen"],
  topItems: ["most common items", "en sık öğeler"], thinking: ["reading your question…", "sorunu okuyorum…"],
  stillWorking: ["still working — for a memory question the miners are being run on your file; this can take up to about a minute",
                 "hâlâ çalışıyorum — bellek sorusunda algoritmalar senin verinde koşturuluyor; bu bir dakikaya kadar sürebilir"],
  recommended: ["Recommended", "Önerilen"], notHere: ["not installed here", "burada kurulu değil"],
  bestHere: ["Best you can run here", "Burada çalıştırabileceğin en iyisi"],
  none: ["No verified implementation fits this request.", "Bu isteğe uyan doğrulanmış bir implementasyon yok."],
  tier: ["tier", "grup"], impl: ["implementation", "implementasyon"], rt: ["runtime", "süre"],
  mem: ["memory", "bellek"], fin: ["finishes", "biter"], inst: ["here", "burada"],
  refused: ["excluded, and why", "elenenler ve nedenleri"], srcLlm: ["written by the language model; algorithm names and numbers checked against the decision", "dil modeli yazdı; algoritma adları ve sayılar karara karşı denetlendi"],
  srcTpl: ["template text", "şablon metin"], tiers: ["Rows in the same group cannot be told apart by the data.", "Aynı gruptaki satırlar veriyle birbirinden ayırt edilemiyor."],
  loaded: ["loaded", "yüklendi"],
  overBudget: ["No eligible implementation is predicted to fit the stated budget; this is the least bad.",
               "Uygun hiçbir implementasyonun belirtilen bütçeye sığması beklenmiyor; bu en az kötüsü."],
  extrap: ["Your data is outside the range the costs were measured on, so the ranking is an extrapolation and the times and sizes in brackets are not reliable:",
           "Verin, maliyetlerin ölçüldüğü aralığın dışında; sıralama bir tahmin, parantez içindeki süre ve bellek değerleri güvenilir değil:"],
  probeMeasured: ["measured on your file", "verinde ölçüldü"],
  probeSampled: ["from samples of your file", "verinin örneklerinden"],
  probeTip: ["time and memory for this miner come from running it on your data, not from the model",
             "bu algoritmanın süre ve belleği modelden değil, verinde koşturulmasından geliyor"],
  budgetUnknown: ["Whether this fits the stated budget cannot be predicted for this data.",
                  "Bunun belirtilen bütçeye sığıp sığmayacağı bu veri için tahmin edilemiyor."],
  extrapShort: ["extrapolated: outside the measured range", "tahmin: ölçülen aralığın dışında"],
  ivTip: ["prediction interval for a new dataset, calibrated over 39-50 datasets the estimate had not seen: 90% guaranteed for values measured or extrapolated on your file, 95% for the model's estimates (wide where the model is unsure)",
          "yeni bir veri seti için tahmin aralığı; tahminin görmediği 39-50 veri setinde kalibre edildi: verinde ölçülen ya da örnekten uzatılan değerler için %90, modelin tahminleri için %95 garanti (model emin değilse geniş)"],
  upTo: ["up to", "en çok"]
};
const t = k => (T[k] || [k, k])[TR ? 1 : 0];
// The server's own sentences (how the file was read, why this threshold, the
// notes) are English facts built from a small fixed set of templates; they are
// translated here, by template, so no wording is invented. Anything that does
// not match -- the measured refusal reasons from the capability base -- stays
// in English rather than being paraphrased.
const DELIM = {commas: "virgül", semicolons: "noktalı virgül", tabs: "sekme", pipes: "dikey çizgi",
               spaces: "boşluk"};
const SERVER_TR = [
  [/^no native miner finished its probe on your file; the ranking rests on how much memory each had taken when stopped, which does not show whether it will finish$/,
   () => "verinde yapılan denemede hiçbir yerel algoritma bitmedi; sıralama, durdurulduklarında ne kadar bellek almış olduklarına dayanıyor ve bu, bitip bitmeyeceklerini göstermiyor"],
  [/^did not finish the probe on your file \((full file|a sample), (\d+) s\): expect it to be heavy here; its memory estimate is the model's$/,
   (m, w, n) => `verinde yapılan denemede bitmedi (${w === "full file" ? "tüm dosya" : "bir örnek"}, ${n} s): burada ağır olması beklenir; bellek tahmini modelden`],
  [/^already in SPMF format \(integer item ids\)$/, () => "zaten SPMF biçiminde (tamsayı öğe kimlikleri)"],
  [/^one transaction per line, items separated by (\w+)$/,
   (m, d) => `her satır bir işlem, öğeler ${DELIM[d] || d} ile ayrılmış`],
  [/^a header of (\d+) item names and one 0\/1 row per transaction, separated by (\w+)$/,
   (m, n, d) => `${n} öğe adından oluşan bir başlık ve her işlem için bir 0/1 satırı, ${DELIM[d] || d} ile ayrılmış`],
  [/^one \(transaction, item\) pair per line, grouped by the first column(, header skipped)?$/,
   (m, h) => "her satır bir (işlem, öğe) çifti, ilk sütuna göre gruplandı" + (h ? ", başlık satırı atlandı" : "")],
  [/^(\d+) of (\d+) items and about (\d+) item pairs are frequent at this threshold$/,
   (m, a, b, c) => `bu eşikte ${b} öğenin ${a} tanesi ve yaklaşık ${c} öğe çifti sık`],
  [/^with (\d+) items there are only (\d+) possible item pairs, and all are frequent at this threshold$/,
   (m, a, b) => `${a} öğeyle yalnızca ${b} olası öğe çifti var ve bu eşikte hepsi sık`],
  [/^even at ([\d.e-]+) only (\d+) item pairs are frequent; this data may be too sparse for pattern mining$/,
   (m, a, b) => `${a} eşiğinde bile yalnızca ${b} öğe çifti sık; bu veri örüntü madenciliği için fazla seyrek olabilir`],
  [/^no support profile for this data type$/, () => "bu veri türü için destek profili yok"],
  [/^([\d,.]+) (records|distinct items|average transaction length|density), trained on ([\d,.e-]+)\.\.([\d,.e-]+)$/,
   (m, x, f, a, b) => `${x} ${{"records": "kayıt", "distinct items": "farklı öğe",
     "average transaction length": "ortalama işlem uzunluğu", "density": "yoğunluk"}[f]} (eğitim aralığı ${a}–${b})`],
  [/^native miners (measured|probed on samples) on your file in ([\d.]+) s$/,
   (m, how, sec) => `native algoritmalar ${how === "measured" ? "verinde doğrudan ölçüldü" : "verinin örneklerinde koşturuldu"} (${sec} s)`],
  [/^(\d+) of (\d+) readings agree$/, (m, a, b) => `${b} okumanın ${a} tanesi aynı sonuçta`],
  [/^language model offline; keyword rules used$/, () => "dil modeli kapalı; anahtar kelime kuralları kullanıldı"],
  [/^language model offline; the request was not changed$/, () => "dil modeli kapalı; istek değiştirilmedi"],
  [/^ignored family (.+): not one this data can serve$/, (m, f) => `${f} ailesi yok sayıldı: bu veriyle yapılamıyor`],
  [/^ignored threshold (.+): out of range$/, (m, v) => `${v} eşiği yok sayıldı: aralık dışında`],
];
function L(str) {
  if (!TR || !str) return str;
  for (const [re, f] of SERVER_TR) { const m = String(str).match(re); if (m) return f(...m); }
  return str;
}
let lastInfo = null;
function applyLang() {
  document.documentElement.lang = TR ? "tr" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll(".langs button").forEach(b =>
    b.classList.toggle("on", (b.dataset.lang === "tr") === TR));
  if (lastInfo) showFacts(lastInfo);
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  TR = b.dataset.lang === "tr";
  try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
  applyLang(); status();
}));
applyLang();

let session = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (x, d=2) => (x == null || isNaN(x)) ? "–" : (Math.abs(x) >= 100 ? Math.round(x).toLocaleString() : Number(x).toFixed(d));

async function status() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("st-llm").textContent = s.llm ? t("llmUp") : t("llmDown");
    $("st-llm").className = "pill " + (s.llm ? "ok" : "off");
    $("st-eng").textContent = s.engine_ready ? t("engOk") : t("engWait");
    $("st-eng").className = "pill " + (s.engine_ready ? "ok" : "");
    if ($("ds").options.length === 0) {
      s.datasets.forEach(d => $("ds").add(new Option(d, d)));
    }
    if (!s.engine_ready) setTimeout(status, 2000);
  } catch (e) { setTimeout(status, 3000); }
}
status();

function showFacts(info) {
  lastInfo = info;
  const p = info.profile;
  let rows = "";
  (p.support_profile || []).forEach(r => {
    rows += `<tr class="${r.sigma === info.threshold ? "sel" : ""}"><td>${r.sigma}${r.sigma === info.threshold ? " ← " + t("suggested") : ""}</td>
      <td>${r.frequent_items.toLocaleString()}</td><td>${r.frequent_pairs.toLocaleString()}</td></tr>`;
  });
  const items = info.top_items ? `<div class="note">${t("topItems")}</div><div class="items">${
      info.top_items.map(([n, pct]) => `<span>${esc(n)} · ${pct}%</span>`).join("")}</div>` : "";
  $("facts").innerHTML = `
    <div class="name">${esc(info.name)}</div>
    <div class="how">${t("readAs")}: ${esc(L(info.how))}</div>
    <div class="kv"><div><b>${p.n_tx.toLocaleString()}</b><span>${t("records")}</span></div>
      <div><b>${p.n_items.toLocaleString()}</b><span>${t("items")}</span></div>
      <div><b>${p.avg_len}</b><span>${t("avglen")}</span></div></div>
    ${rows ? `<table><tr><th>${t("thr")}</th><th>${t("fItems")}</th><th>${t("fPairs")}</th></tr>${rows}</table>
      <div class="note">${esc(L(info.threshold_why || ""))}</div>` : ""}
    ${items}`;
  $("q").disabled = false; $("send").disabled = false; $("q").focus();
  $("log").innerHTML = "";
  bot(`<div class="bubble">${esc(info.name)} — ${t("loaded")}. ${esc(L(info.how))}.</div>`);
}

async function load(req) {
  $("facts").innerHTML = `<div class="thinking">…</div>`;
  try {
    const r = await fetch(req.url, req.opts);
    const info = await r.json();
    if (!r.ok) throw new Error(info.error);
    session = info.session; showFacts(info);
  } catch (e) { $("facts").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  load({url: "/api/upload", opts: {method: "POST", body: f,
        headers: {"X-Filename": encodeURIComponent(f.name)}}});
};
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hover"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hover"); }));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) load({url: "/api/upload", opts: {method: "POST", body: f, headers: {"X-Filename": encodeURIComponent(f.name)}}});
});
$("dsgo").onclick = () => load({url: "/api/dataset", opts: {method: "POST",
  headers: {"Content-Type": "application/json"}, body: JSON.stringify({dataset: $("ds").value})}});

function user(text) { $("log").insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div>`); scroll(); }
function bot(html) { $("log").insertAdjacentHTML("beforeend", `<div class="msg bot">${html}</div>`); scroll(); }
function scroll() { $("log").scrollTop = $("log").scrollHeight; }

async function send(text, choice) {
  const body = {session, text, choice, lang: TR ? "tr" : "en"};
  const wait = document.createElement("div");
  wait.className = "msg bot thinking"; wait.textContent = t("thinking");
  $("log").appendChild(wait); scroll();
  $("send").disabled = true;
  // A memory request runs the native miners on the user's file (up to ~60 s
  // on hard thresholds); say so rather than leave "reading…" on screen.
  const slow = setTimeout(() => { wait.textContent = t("stillWorking"); }, 3000);
  try {
    const r = await fetch("/api/message", {method: "POST", headers: {"Content-Type": "application/json"},
                                           body: JSON.stringify(body)});
    const d = await r.json();
    wait.remove();
    if (!r.ok) throw new Error(d.error);
    render(d);
  } catch (e) { wait.remove(); bot(`<div class="bubble err">${esc(e.message)}</div>`); }
  clearTimeout(slow);
  $("send").disabled = false;
}

function render(d) {
  if (d.type === "clarify") {
    const opts = d.options.map((o, i) => `<button data-i="${i}">${esc(o)}</button>`).join("");
    bot(`<div class="bubble">${esc(d.text)}<div class="opts">${opts}</div></div>`);
    const last = $("log").lastElementChild;
    last.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      last.querySelectorAll(".opts button").forEach(x => x.disabled = true);
      user(b.textContent); send(null, Number(b.dataset.i));
    });
    return;
  }
  if (d.type === "question") { bot(`<div class="bubble">${esc(d.text)}</div>`); return; }
  const rows = d.rows || [];
  let head = "";
  if (!rows.length) head = `<div class="warn">${t("none")}</div>`;
  else {
    const top = rows[0];
    head = `<div class="pick"><span class="label">${t("recommended")}</span><span class="algo">${esc(top.display)}</span>
      ${top.installed ? "" : `<span class="tag no">${t("notHere")}</span>`}</div>`;
    if (!top.installed && d.runnable) head += `<div class="warn">${t("bestHere")}: <b>${esc(d.runnable)}</b></div>`;
    top.warnings.forEach(w => head += `<div class="warn">${esc(L(w))}</div>`);
    const pick = top.installed ? top : (rows.find(r => r.installed) || top);
    const extrap = pick.extrapolated && pick.extrapolated.length;
    if (!pick.within_budget) head += `<div class="warn">${t(extrap ? "budgetUnknown" : "overBudget")}</div>`;
    if (pick.extrapolated && pick.extrapolated.length)
      head += `<div class="warn">${t("extrap")}<br><span style="font-size:12px">${
        pick.extrapolated.map(x => esc(L(x))).join(" · ")}</span></div>`;
  }
  // 90% prediction interval under the point estimate. Runtime shows only its
  // upper end: the model's lower end is near zero and says nothing.
  const iv = (b, u, upper) => b ? `<div class="iv" title="${esc(t("ivTip"))}">${
    upper ? `${t("upTo")} ${fmt(b[1])}` : `${fmt(b[0], 1)}–${fmt(b[1], 1)}`} ${u}</div>` : "";
  let prev = null;
  const tbl = rows.map(r => {
    const g = r.tier !== prev ? r.tier : ""; prev = r.tier;
    return `<tr class="${r.tier === rows[0].tier ? "sel" : ""}"><td>${g}</td><td style="text-align:left">${esc(r.display)}${
      (r.source || "").startsWith("probe") ? ` <span class="tag yes" title="${esc(t("probeTip"))}">${
        t(r.source === "probe-measured" ? "probeMeasured" : "probeSampled")}</span>` : ""}</td>
      ${r.extrapolated && r.extrapolated.length
        ? `<td title="${esc(t("extrapShort"))}">(${fmt(r.runtime_s)} s)*</td><td>(${fmt(r.memory_mb, 1)} MB)*</td>`
        : `<td>${fmt(r.runtime_typical_s ?? r.runtime_s)} s${iv(r.runtime_interval, "s")}</td><td>${fmt(r.memory_mb, 1)} MB${iv(r.memory_interval, "MB")}</td>`}<td>${Math.round(100 * r.p_complete)}%</td>
      <td><span class="tag ${r.installed ? "yes" : "no"}">${r.installed ? "✓" : "✗"}</span></td></tr>`;
  }).join("");
  const refused = (d.refused || []).map(r => `<li><b>${esc(r.display)}</b> — ${esc(r.reason)}</li>`).join("");
  const notes = (d.notes || []).map(n => `<div class="note">${esc(L(n))}</div>`).join("");
  bot(`<div class="bubble">${esc(d.explanation)}
      <div class="src">${d.explanation_source === "llm" ? t("srcLlm") : t("srcTpl")}</div></div>
    <div class="card">${head}
      ${rows.length ? `<table style="margin-top:10px"><tr><th>${t("tier")}</th><th style="text-align:left">${t("impl")}</th>
        <th>${t("rt")}</th><th>${t("mem")}</th><th>${t("fin")}</th><th>${t("inst")}</th></tr>${tbl}</table>
        <div class="note">${t("tiers")}</div>` : ""}
      ${refused ? `<details><summary>${t("refused")} (${d.refused.length})</summary><ul>${refused}</ul></details>` : ""}
      ${notes}
      <div class="task">${esc(d.task)} · ${t("thr")} ${d.threshold} (${esc(L(d.threshold_why))})</div>
    </div>`);
}

$("form").onsubmit = e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (!q || !session) return;
  $("q").value = ""; user(q); send(q, null);
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
</script>
</body>
</html>
